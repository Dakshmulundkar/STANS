name: Security Scanning — Trivy

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  schedule:
    # Run every Monday at 08:00 UTC to catch newly disclosed CVEs
    - cron: "0 8 * * 1"

permissions:
  contents: read
  security-events: write  # Required to upload SARIF results to GitHub Security tab

env:
  # Pin to a known-safe Trivy version (pre-March-2026 supply chain compromise).
  # See: https://github.com/aquasecurity/trivy/security/advisories/GHSA-69fq-xp46-6x23
  TRIVY_VERSION: "0.63.0"

jobs:
  # ── Job 1: Scan the filesystem (source + dependencies) ──────────────────────
  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # SHA-pinned: actions/checkout@v4 (tag: v4.2.2)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Trivy binary directly
        # Download install script to a temp file first — avoids curl|sh pipe
        # propagation issues where a failed curl silently passes empty input to sh.
        # set -eo pipefail: -e exits on any error, -o pipefail catches pipe failures.
        run: |
          set -eo pipefail
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            -o /tmp/trivy-install.sh
          sh /tmp/trivy-install.sh -b /usr/local/bin "v${TRIVY_VERSION}"
          /usr/local/bin/trivy --version || (echo "ERROR: Trivy installation failed" && exit 1)
          echo "/usr/local/bin" >> $GITHUB_PATH

      - name: Run Trivy filesystem scan
        run: |
          set -eo pipefail
          /usr/local/bin/trivy fs \
            --format sarif \
            --output trivy-fs-results.sarif \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            .
        # continue-on-error: true so the SARIF upload always runs even when
        # vulnerabilities are found (exit-code 1). Job is failed explicitly below.
        continue-on-error: true

      - name: Upload Trivy filesystem SARIF to GitHub Security tab
        # SHA-pinned: github/codeql-action/upload-sarif@v3 (tag: v3.28.19)
        uses: github/codeql-action/upload-sarif@ff0a06e83cb2de871e5a09832bc6a81e7276941f
        if: always() && hashFiles('trivy-fs-results.sarif') != ''
        with:
          sarif_file: "trivy-fs-results.sarif"
          category: "trivy-fs"

      - name: Fail job if CRITICAL vulnerabilities were found
        # Full path used — does not rely on PATH being set from GITHUB_PATH.
        if: always()
        run: |
          set -eo pipefail
          /usr/local/bin/trivy fs \
            --format table \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            .

  # ── Job 2: Build image then scan it ─────────────────────────────────────────
  trivy-image:
    name: Trivy Image Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # SHA-pinned: actions/checkout@v4 (tag: v4.2.2)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Trivy binary directly
        run: |
          set -eo pipefail
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            -o /tmp/trivy-install.sh
          sh /tmp/trivy-install.sh -b /usr/local/bin "v${TRIVY_VERSION}"
          /usr/local/bin/trivy --version || (echo "ERROR: Trivy installation failed" && exit 1)
          echo "/usr/local/bin" >> $GITHUB_PATH

      - name: Build Docker image for scanning
        run: docker build -t stans-scan:${{ github.sha }} .

      - name: Run Trivy image scan
        run: |
          set -eo pipefail
          /usr/local/bin/trivy image \
            --format sarif \
            --output trivy-image-results.sarif \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            "stans-scan:${{ github.sha }}"
        continue-on-error: true

      - name: Upload Trivy image SARIF to GitHub Security tab
        # SHA-pinned: github/codeql-action/upload-sarif@v3 (tag: v3.28.19)
        uses: github/codeql-action/upload-sarif@ff0a06e83cb2de871e5a09832bc6a81e7276941f
        if: always() && hashFiles('trivy-image-results.sarif') != ''
        with:
          sarif_file: "trivy-image-results.sarif"
          category: "trivy-image"

      - name: Fail job if CRITICAL vulnerabilities were found
        if: always()
        run: |
          set -eo pipefail
          /usr/local/bin/trivy image \
            --format table \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            "stans-scan:${{ github.sha }}"
